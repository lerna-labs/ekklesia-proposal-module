<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{{brand.platformName}}</title>
  </head>
  <body style="margin:0;padding:0;background:{{brand.colors.bodyBackground}};font-family:{{brand.fontFamily}};">
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:{{brand.colors.bodyBackground}};padding:24px 0;">
      <tr>
        <td align="center">
          <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:600px;background:{{brand.colors.cardBackground}};border:1px solid {{brand.colors.divider}};border-radius:8px;overflow:hidden;">
            <tr>
              <td style="padding:18px 24px;background:{{brand.colors.headerBackground}};color:{{brand.colors.headerText}};font-size:16px;font-weight:600;">
                {{brand.platformName}}
              </td>
            </tr>
            <tr>
              <td style="padding:24px;color:{{brand.colors.text}};font-size:15px;line-height:1.5;">
                <h1 style="margin:0 0 12px;font-size:20px;line-height:1.3;color:{{brand.colors.text}};">{{heading}}</h1>
                <p style="margin:0 0 16px;color:{{brand.colors.textSecondary}};">{{body}}</p>
                <table role="presentation" cellpadding="0" cellspacing="0" style="margin:0 0 14px;">
                  <tr>
                    <td style="background:{{brand.colors.ctaBackground}};border-radius:6px;">
                      <a href="{{ctaUrl}}" style="display:inline-block;padding:10px 16px;color:{{brand.colors.ctaText}};text-decoration:none;font-weight:600;">{{ctaLabel}}</a>
                    </td>
                  </tr>
                </table>
                <p style="margin:0 0 12px;color:{{brand.colors.textMuted}};font-size:13px;word-break:break-all;">If the button does not work, copy and paste this link into your browser:<br />{{ctaUrl}}</p>
                {{#if note}}
                  <p style="margin:0;color:{{brand.colors.textMuted}};font-size:13px;">{{note}}</p>
                {{/if}}
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
