name: Feature request
description: Suggest an enhancement for the Ekklesia Proposal Module
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        Describe the problem you want to solve and any ideas for a solution.

  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What pain point or gap does this address?
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: How should it work from a user or operator perspective?
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other approaches you thought about (optional).
    validations:
      required: false

  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Links, mockups, or related issues (optional).
    validations:
      required: false
