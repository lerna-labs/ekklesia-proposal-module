name: Publish release artifact

# Packages the deployable source on a version tag and attaches it to the GitHub
# Release. Runs only on a version tag (never on a plain push to main), so a
# release publishes exactly once. "!v*-*" excludes prerelease tags.
on:
  push:
    tags: ["v*", "!v*-*"]

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Build frontend
        working-directory: __frontend
        run: |
          npm ci
          npm run build

      - name: Package source tarball
        id: pkg
        run: |
          version="${GITHUB_REF_NAME#v}"
          # Same manifest as the preprod build (staging-rc.yml): tracked runtime
          # files only, no test suites, no untracked secrets or dumps, plus the
          # built frontend.
          asset="proposal-module-server-${version}.tgz"
          git ls-files -z -- \
            server.js package.json package-lock.json \
            README.md LICENSE \
            routes helper schema cron validation mailer backup \
            development.config.cjs production.config.cjs \
            ':(exclude)helper/__tests__/**' \
            ':(exclude)mailer/tests/**' ':(exclude)mailer/dev-tests/**' \
            > "$RUNNER_TEMP/manifest.lst"
          # The built frontend lands in public/ (adapter-static); it is untracked, so add it explicitly.
          { cat "$RUNNER_TEMP/manifest.lst"; find public -type f -print0; } \
            | tar --null -T - -czf "$asset"
          echo "asset=$asset" >> "$GITHUB_OUTPUT"

      - uses: actions/create-github-app-token@v3
        id: app-token
        with:
          client-id: ${{ vars.RELEASE_MANAGER_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_MANAGER_APP_PRIVATE_KEY }}

      - name: Create GitHub Release with the source tarball
        # Attributed to the Release Manager App. Notes are the CHANGELOG section
        # for this version.
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          notes=$(awk -v v="## ${version}" '$0==v{f=1;next} /^## /{if(f)exit} f' CHANGELOG.md)
          gh release create "${GITHUB_REF_NAME}" \
            --title "${GITHUB_REF_NAME}" \
            --notes "${notes:-Release ${GITHUB_REF_NAME}}" \
            "${{ steps.pkg.outputs.asset }}"
