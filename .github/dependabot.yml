version: 2
# Automatic pull requests are disabled: open-pull-requests-limit is 0 on both
# blocks below. Dependabot alerts stay enabled and are the signal; dependency
# updates land as maintainer-authored batches. Dependabot security updates are
# disabled in repository settings for the same reason.
#
# To re-enable, restore a non-zero open-pull-requests-limit here and turn
# Dependabot security updates back on in repository settings.
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 0
  - package-ecosystem: "npm"
    directory: "/__frontend"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 0
